<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperLeeK Game Hub - Mini Arcade</title>
    <meta name="description" content="SuperLeeK Arcade Mini Games Center" />

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --bg: #0b0f19;
        --card-bg: rgba(17, 24, 39, 0.8);
        --border: rgba(255, 255, 255, 0.1);
        --accent: #f472b6;
        --accent-glow: rgba(244, 114, 182, 0.2);
        --text: #f3f4f6;
        --text-muted: #9ca3af;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
      }

      .header-nav {
        width: 100%;
        max-width: 900px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2.5rem;
      }

      .back-btn {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
        padding: 0.5rem 1rem;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        transition: all 0.2s ease;
      }

      .back-btn:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        transform: translateX(-3px);
      }

      .title {
        font-family: "Press Start 2P", cursive;
        font-size: 1.4rem;
        color: var(--accent);
        text-shadow: 0 0 12px var(--accent-glow);
      }

      .game-container {
        width: 100%;
        max-width: 900px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        padding: 2rem;
        backdrop-filter: blur(12px);
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }

      .arcade-screen {
        background: #000;
        border: 2px solid var(--border);
        border-radius: 1rem;
        width: 100%;
        max-width: 480px;
        height: 480px;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        background: #090d16;
      }

      .controls-info {
        margin-top: 1.5rem;
        color: var(--text-muted);
        font-size: 0.9rem;
        text-align: center;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .key-badge {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid var(--border);
        padding: 0.2rem 0.6rem;
        border-radius: 0.4rem;
        font-family: monospace;
        color: var(--text);
      }

      .score-board {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 480px;
        margin-bottom: 1rem;
        font-family: "Press Start 2P", cursive;
        font-size: 0.9rem;
      }

      .score-value {
        color: #38bdf8;
      }
      .high-score {
        color: #34d399;
      }

      .overlay-start {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(11, 15, 25, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        backdrop-filter: blur(4px);
      }

      .start-btn {
        font-family: "Press Start 2P", cursive;
        padding: 1rem 1.5rem;
        font-size: 0.9rem;
        background: var(--accent);
        color: #000;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        box-shadow: 0 0 20px var(--accent-glow);
        transition: transform 0.2s ease;
      }

      .start-btn:hover {
        transform: scale(1.05);
      }

      .private-guard-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        padding: 3rem 2rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="header-nav">
      <a href="../" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> 대시보드로 돌아가기
      </a>
      <h1 class="title">ARCADE HUB</h1>
    </div>

    <div id="gameContent" class="game-container">
      <div class="score-board">
        <div>SCORE: <span id="score" class="score-value">0</span></div>
        <div>HIGH: <span id="highScore" class="high-score">0</span></div>
      </div>

      <div class="arcade-screen">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="overlay" class="overlay-start">
          <h2
            style="
              font-family: &quot;Press Start 2P&quot;, cursive;
              font-size: 1.1rem;
              color: #fff;
              text-align: center;
            "
          >
            RETRO SNAKE
          </h2>
          <button id="startBtn" class="start-btn">PRESS TO PLAY</button>
        </div>
      </div>

      <div class="controls-info">
        <div>
          조작키: <span class="key-badge">▲</span> <span class="key-badge">▼</span>
          <span class="key-badge">◄</span> <span class="key-badge">►</span> 방향키로 이동
        </div>
      </div>
    </div>

    <!-- Private Locked Guard View -->
    <div
      id="privateGuardView"
      class="private-guard-card"
      style="display: none; max-width: 600px; width: 100%"
    >
      <i class="fa-solid fa-lock" style="font-size: 3rem; color: var(--accent)"></i>
      <div>
        <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem">비공개 게임 센터</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem">
          현재 비공개(Private) 모드 상태입니다. 이용을 위해 먼저 대시보드에서 로그인해주세요.
        </p>
      </div>
      <a href="../" class="start-btn" style="text-decoration: none"> 대시보드로 이동 </a>
    </div>

    <script type="module">
      import { auth } from "../js/auth.js?t=1788137888";

      const gameContent = document.getElementById("gameContent");
      const privateGuardView = document.getElementById("privateGuardView");

      auth.guardPage(() => {
        gameContent.style.display = "none";
        privateGuardView.style.display = "flex";
      });
    </script>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const startBtn = document.getElementById("startBtn");
      const scoreEl = document.getElementById("score");
      const highScoreEl = document.getElementById("highScore");

      const grid = 20;
      const tileCount = 20;

      let snake = [];
      let food = { x: 0, y: 0 };
      let dx = grid;
      let dy = 0;
      let score = 0;
      let highScore = localStorage.getItem("snake_high_score") || 0;
      let gameInterval = null;
      let isRunning = false;

      highScoreEl.textContent = highScore;

      function resetGame() {
        snake = [
          { x: 160, y: 200 },
          { x: 140, y: 200 },
          { x: 120, y: 200 },
        ];
        score = 0;
        dx = grid;
        dy = 0;
        scoreEl.textContent = score;
        spawnFood();
      }

      function spawnFood() {
        food.x = Math.floor(Math.random() * tileCount) * grid;
        food.y = Math.floor(Math.random() * tileCount) * grid;
      }

      function draw() {
        ctx.fillStyle = "#090d16";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
        for (let i = 0; i < canvas.width; i += grid) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(canvas.width, i);
          ctx.stroke();
        }

        ctx.fillStyle = "#f472b6";
        ctx.shadowColor = "#f472b6";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(food.x + grid / 2, food.y + grid / 2, grid / 2 - 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        snake.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? "#38bdf8" : "#818cf8";
          ctx.fillRect(part.x + 1, part.y + 1, grid - 2, grid - 2);
        });
      }

      function update() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
          gameOver();
          return;
        }

        for (let i = 0; i < snake.length; i++) {
          if (head.x === snake[i].x && head.y === snake[i].y) {
            gameOver();
            return;
          }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = score;
          if (score > highScore) {
            highScore = score;
            highScoreEl.textContent = highScore;
            localStorage.setItem("snake_high_score", highScore);
          }
          spawnFood();
        } else {
          snake.pop();
        }

        draw();
      }

      function gameOver() {
        clearInterval(gameInterval);
        isRunning = false;
        overlay.style.display = "flex";
        overlay.querySelector("h2").textContent = "GAME OVER";
        startBtn.textContent = "RETRY";
      }

      function startGame() {
        resetGame();
        overlay.style.display = "none";
        isRunning = true;
        draw();
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(update, 120);
      }

      startBtn.addEventListener("click", startGame);

      window.addEventListener("keydown", e => {
        if (!isRunning) return;

        switch (e.key) {
          case "ArrowUp":
            if (dy === 0) {
              dx = 0;
              dy = -grid;
            }
            break;
          case "ArrowDown":
            if (dy === 0) {
              dx = 0;
              dy = grid;
            }
            break;
          case "ArrowLeft":
            if (dx === 0) {
              dx = -grid;
              dy = 0;
            }
            break;
          case "ArrowRight":
            if (dx === 0) {
              dx = 0;
              dy = grid;
            }
            break;
        }
      });

      draw();
    </script>
  </body>
</html>
